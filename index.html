<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Cell Explorer VR</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="scripts/movement.js"></script>
    <script src="scripts/organelles.js"></script>
    <script src="scripts/proximity.js"></script>

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #060d08; overflow: hidden; }
      .a-enter-vr-button {
        width: 80px !important; height: 80px !important;
        bottom: 24px !important; right: 24px !important;
        border-radius: 50% !important;
      }
    </style>
  </head>

  <body>
    <a-scene
      background="color: #060d08"
      fog="type: exponential; color: #0d2211; density: 0.025"
      renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true"
      vr-mode-ui="enabled: true"
      loading-screen="backgroundColor: #060d08; dotsColor: #52d4a4"
    >

      <!-- ══════════════════════ ASSETS ══════════════════════ -->
      <a-assets timeout="10000">
        <!-- <a-asset-item id="nucleus-model" src="models/nucleus.glb"></a-asset-item> -->
      </a-assets>

      <!-- ══════════════════════ CELL MEMBRANE ══════════════════════
           Radius 20 — user stands fully inside.
           side: double → visible from inside.
      -->
      <a-sphere
        id="cell-membrane"
        radius="20"
        material="
          color: #52d4a4; opacity: 0.16; transparent: true;
          side: double; roughness: 0.05; metalness: 0.4; depthWrite: false;
        "
        animation="
          property: scale; to: 1.025 1.025 1.025;
          dir: alternate; dur: 5000; loop: true; easing: easeInOutSine;
        "
      ></a-sphere>

      <!-- Inner glow layer -->
      <a-sphere
        radius="19.4"
        material="color: #38b48a; opacity: 0.06; transparent: true; side: back; roughness: 1; depthWrite: false;"
      ></a-sphere>

      <!-- ══════════════════════ CYTOPLASM ENVIRONMENT ══════════════════════ -->
      <a-circle
        radius="20" rotation="-90 0 0" position="0 -0.02 0"
        material="color: #0d2914; opacity: 0.9; roughness: 1;"
      ></a-circle>

      <a-sphere
        radius="19"
        material="color: #1a3d22; opacity: 0.1; transparent: true; side: back; roughness: 1; depthWrite: false;"
      ></a-sphere>

      <!-- Cytoplasmic protein particles -->
      <a-entity id="cytoplasm-particles" cyto-particles="count: 55; radius: 16"></a-entity>

      <!-- ══════════════════════════════════════════════════════════════
           ORGANELLES
           ─────────────────────────────────────────────────────────────
           Each organelle entity has:
             · shape primitive(s) — placeholder geometry
             · organelle-info component — floating label + proximity panel
           ══════════════════════════════════════════════════════════════ -->

      <!-- ① NUCLEUS  ·  color: #f5a623 (amber)  ·  position: centre-back -->
      <a-entity
        id="nucleus"
        position="0 2.5 -7"
        organelle-info="
          title:    Nucleus;
          body:     The control centre of the cell. Contains DNA and directs cell activity including growth, metabolism, and reproduction.;
          distance: 5;
          color:    #f5a623;
        "
      >
        <!-- Outer nuclear envelope — double membrane -->
        <a-sphere
          radius="2.8"
          material="
            color: #f5a623; opacity: 0.25; transparent: true;
            side: double; roughness: 0.1; metalness: 0.5; depthWrite: false;
          "
          animation="property: rotation; to: 0 360 0; dur: 40000; loop: true; easing: linear;"
        ></a-sphere>

        <!-- Inner nucleoplasm — solid fill -->
        <a-sphere
          radius="2.2"
          material="color: #f5a623; opacity: 0.6; roughness: 0.2; metalness: 0.3;"
        ></a-sphere>

        <!-- Nucleolus — dense inner spot -->
        <a-sphere
          radius="0.72"
          position="0.45 0.35 -0.5"
          material="color: #c27a10; opacity: 0.95; roughness: 0.3;"
        ></a-sphere>

        <!-- Warm point light -->
        <a-light type="point" color="#f5b85a" intensity="1.8" distance="14" decay="2"></a-light>
      </a-entity>

      <!-- ② MITOCHONDRIA  ·  color: #e74c3c (red)  ·  right side -->
      <a-entity
        id="mitochondria-group"
        position="6 1.5 -3"
        organelle-info="
          title:    Mitochondria;
          body:     The powerhouse of the cell. Produces ATP through cellular respiration, supplying energy for all cellular processes.;
          distance: 4;
          color:    #e74c3c;
        "
      >
        <a-entity mito-organelle="index: 0; color: #e74c3c; ox:  0;    oy: 0;    oz: 0"  ></a-entity>
        <a-entity mito-organelle="index: 1; color: #c0392b; ox:  1.6;  oy: 0.5;  oz: -1.1"></a-entity>
        <a-entity mito-organelle="index: 2; color: #ec7063; ox: -1.2;  oy: -0.3; oz: 0.9"></a-entity>
        <a-entity mito-organelle="index: 3; color: #a93226; ox:  0.6;  oy: -0.8; oz: 1.3"></a-entity>
      </a-entity>

      <!-- ③ ENDOPLASMIC RETICULUM  ·  color: #3498db (blue)  ·  left side -->
      <a-entity
        id="er-group"
        position="-7 1.5 -1"
        organelle-info="
          title:    Endoplasmic Reticulum;
          body:     A network of folded membranes. Rough ER has ribosomes and makes proteins. Smooth ER synthesises lipids and detoxifies chemicals.;
          distance: 4.5;
          color:    #3498db;
        "
      >
        <a-entity er-stack="layers: 7; color: #3498db; spacing: 0.5"></a-entity>
        <a-light type="point" color="#2980b9" intensity="0.7" distance="6" decay="2"></a-light>
      </a-entity>

      <!-- ④ RIBOSOMES  ·  color: #9b59b6 (purple)  ·  scattered + cluster label -->
      <a-entity
        id="ribosomes-cluster"
        position="3 3 3"
        organelle-info="
          title:    Ribosomes;
          body:     Tiny molecular machines made of RNA and protein. They translate genetic instructions from mRNA into polypeptide chains (proteins).;
          distance: 5;
          color:    #9b59b6;
        "
      >
        <!-- Visible cluster near the label anchor -->
        <a-sphere radius="0.12" position=" 0    0    0"    material="color: #9b59b6; opacity: 0.9;"></a-sphere>
        <a-sphere radius="0.10" position=" 0.3  0.2  0.1" material="color: #8e44ad; opacity: 0.9;"></a-sphere>
        <a-sphere radius="0.09" position="-0.2  0.3 -0.2" material="color: #a569bd; opacity: 0.9;"></a-sphere>
        <a-sphere radius="0.11" position=" 0.1 -0.2  0.3" material="color: #9b59b6; opacity: 0.9;"></a-sphere>
      </a-entity>

      <!-- Scattered ribosomes throughout the cytoplasm -->
      <a-entity ribosome-scatter="count: 55; radius: 13; color: #9b59b6"></a-entity>

      <!-- ⑤ GOLGI APPARATUS  ·  color: #f1c40f (yellow)  ·  front-right -->
      <a-entity
        id="golgi"
        position="5 1.5 5"
        organelle-info="
          title:    Golgi Apparatus;
          body:     The cell's postal system. Receives proteins from the ER, modifies and packages them into vesicles, then ships them to their final destinations.;
          distance: 4;
          color:    #f1c40f;
        "
      >
        <a-entity golgi-apparatus="layers: 6; color: #f1c40f; spacing: 0.4"></a-entity>
        <a-light type="point" color="#f39c12" intensity="0.8" distance="6" decay="2"></a-light>
      </a-entity>

      <!-- ══════════════════════ LIGHTING ══════════════════════ -->
      <a-light type="ambient"     color="#1a4d2e"  intensity="0.55"></a-light>
      <a-light type="hemisphere"  color="#2d8f6f"  ground-color="#3d2a08" intensity="0.45"></a-light>
      <a-light type="directional" position="10 8 -10" color="#5ee8b0" intensity="0.35"></a-light>

      <!-- ══════════════════════ SKY ══════════════════════ -->
      <a-sky color="#030a05"></a-sky>

      <!-- ══════════════════════ CAMERA RIG ══════════════════════ -->
      <a-entity id="rig" position="0 0 11" cell-locomotion="speed: 3.5; boundary: 18.5">

        <a-camera
          id="camera"
          look-controls="pointerLockEnabled: true; reverseMouseDrag: false"
          wasd-controls="enabled: false"
          fov="80" near="0.05" far="100"
        >
          <a-cursor
            color="#52d4a4" opacity="0.7"
            raycaster="objects: .interactive; far: 25"
          ></a-cursor>

          <!-- Desktop hint -->
          <a-plane
            position="0 -0.38 -1" width="0.95" height="0.09"
            material="color: #000; opacity: 0.45; transparent: true"
            visible-in-vr-mode="false"
          >
            <a-text
              value="WASD / Arrows — move  |  Mouse — look  |  Walk near organelles to learn more"
              align="center" color="#52d4a4" width="2.1" position="0 0 0.001"
            ></a-text>
          </a-plane>
        </a-camera>

        <!-- Quest controllers -->
        <a-entity
          laser-controls="hand: left"
          raycaster="objects: .interactive; far: 25; showLine: true; lineColor: #52d4a4; lineOpacity: 0.6"
        ></a-entity>
        <a-entity
          laser-controls="hand: right"
          raycaster="objects: .interactive; far: 25; showLine: true; lineColor: #52d4a4; lineOpacity: 0.6"
        ></a-entity>
      </a-entity>

    </a-scene>
  </body>
</html>
