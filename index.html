<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Cell Explorer VR</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="scripts/movement.js"></script>
    <script src="scripts/organelles.js"></script>
    <script src="scripts/proximity.js"></script>
    <script src="scripts/tasks.js"></script>

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #060d08; overflow: hidden; }
      .a-enter-vr-button {
        width: 80px !important; height: 80px !important;
        bottom: 24px !important; right: 24px !important;
        border-radius: 50% !important;
      }
    </style>
  </head>

  <body>
    <a-scene
      background="color: #060d08"
      fog="type: exponential; color: #0d2211; density: 0.018"
      renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true"
      vr-mode-ui="enabled: true"
      loading-screen="backgroundColor: #060d08; dotsColor: #52d4a4"
    >

      <!-- ══════════════════════ ASSETS ══════════════════════ -->
      <a-assets timeout="15000">
        <a-asset-item id="mito-model" src="models/mitochondria.glb"></a-asset-item>
      </a-assets>

      <!-- ══════════════════════ CELL MEMBRANE ══════════════════════
           Radius 20 — user stands fully inside.
           side: double → visible from inside.
      -->
      <a-sphere
        id="cell-membrane"
        radius="20"
        material="
          color: #52d4a4; opacity: 0.22; transparent: true;
          side: double; roughness: 0.05; metalness: 0.5; depthWrite: false;
          emissive: #1a6645; emissiveIntensity: 0.15;
        "
        animation="
          property: scale; to: 1.025 1.025 1.025;
          dir: alternate; dur: 5000; loop: true; easing: easeInOutSine;
        "
      ></a-sphere>

      <!-- Inner glow layer -->
      <a-sphere
        radius="19.4"
        material="color: #38b48a; opacity: 0.08; transparent: true; side: back; roughness: 1; depthWrite: false;
                  emissive: #25805a; emissiveIntensity: 0.08;"
      ></a-sphere>

      <!-- ══════════════════════ CYTOPLASM ENVIRONMENT ══════════════════════ -->
      <a-circle
        radius="20" rotation="-90 0 0" position="0 -0.02 0"
        material="color: #0d2914; opacity: 0.9; roughness: 1;"
      ></a-circle>

      <a-sphere
        radius="19"
        material="color: #1a3d22; opacity: 0.12; transparent: true; side: back; roughness: 1; depthWrite: false;"
      ></a-sphere>

      <!-- More cytoplasmic particles for denser atmosphere -->
      <a-entity id="cytoplasm-particles" cyto-particles="count: 90; radius: 16"></a-entity>

      <!-- ══════════════════════════════════════════════════════════════
           ORGANELLES
           ══════════════════════════════════════════════════════════════ -->

      <!-- ① NUCLEUS  ·  amber  ·  centre-back -->
      <a-entity
        id="nucleus"
        position="0 2.5 -7"
        organelle-info="
          title:    Nucleus;
          body:     The control centre of the cell. Contains DNA and directs cell activity including growth, metabolism, and reproduction.;
          distance: 5;
          color:    #f5a623;
          audio:    nucleus.mp3;
        "
        nucleus-pores="count: 28; radius: 2.82; color: #e8aa40"
      >
        <!-- Outer nuclear envelope — double membrane -->
        <a-sphere
          radius="2.8"
          material="
            color: #f5a623; opacity: 0.28; transparent: true;
            side: double; roughness: 0.1; metalness: 0.5; depthWrite: false;
            emissive: #b06d10; emissiveIntensity: 0.25;
          "
          animation="property: rotation; to: 0 360 0; dur: 40000; loop: true; easing: linear;"
        ></a-sphere>

        <!-- Inner nucleoplasm — solid fill -->
        <a-sphere
          radius="2.2"
          material="color: #f5a623; opacity: 0.65; roughness: 0.2; metalness: 0.3;
                    emissive: #a05c08; emissiveIntensity: 0.3;"
        ></a-sphere>

        <!-- Nucleolus — dense inner spot -->
        <a-sphere
          radius="0.72"
          position="0.45 0.35 -0.5"
          material="color: #c27a10; opacity: 0.95; roughness: 0.3;
                    emissive: #8a4800; emissiveIntensity: 0.4;"
        ></a-sphere>

        <!-- Outer corona glow — pulsing halo -->
        <a-sphere
          radius="3.35"
          material="color: #f5a623; opacity: 0.07; transparent: true; side: back; roughness: 1; depthWrite: false;
                    emissive: #f5a623; emissiveIntensity: 0.12;"
          animation="property: scale; to: 1.08 1.08 1.08; dir: alternate; dur: 3200; loop: true; easing: easeInOutSine;"
        ></a-sphere>

        <!-- DNA orbital rings -->
        <a-torus
          radius="3.1" radius-tubular="0.04" segments-radial="80" segments-tubular="12"
          material="color: #ffe080; opacity: 0.55; transparent: true; roughness: 0.1; metalness: 0.7; depthWrite: false;
                    emissive: #ffcc00; emissiveIntensity: 0.5;"
          rotation="68 0 0"
          animation="property: rotation; to: 68 360 0; dur: 18000; loop: true; easing: linear;"
        ></a-torus>
        <a-torus
          radius="3.0" radius-tubular="0.04" segments-radial="80" segments-tubular="12"
          material="color: #ffe080; opacity: 0.4; transparent: true; roughness: 0.1; metalness: 0.7; depthWrite: false;
                    emissive: #ffcc00; emissiveIntensity: 0.4;"
          rotation="-42 25 0"
          animation="property: rotation; to: -42 -360 0; dur: 26000; loop: true; easing: linear;"
        ></a-torus>

        <!-- Strong warm point light -->
        <a-light type="point" color="#f5b85a" intensity="2.8" distance="18" decay="2"></a-light>
        <a-light type="point" color="#ffd080" intensity="0.9" distance="10" decay="2" position="1.5 -1 1"></a-light>
      </a-entity>

      <!-- ② MITOCHONDRIA  ·  GLB model  ·  right side -->
      <a-entity
        id="mitochondria-group"
        position="6 1.5 -3"
        organelle-info="
          title:    Mitochondria;
          body:     The powerhouse of the cell. Produces ATP through cellular respiration, supplying energy for all cellular processes.;
          distance: 4;
          color:    #e74c3c;
          audio:    mitochondria.mp3;
        "
      >
        <a-gltf-model
          src="#mito-model"
          position="0 0 0"
          scale="0.75 0.75 0.75"
          rotation="8 20 12"
          gltf-emissive="color: #e85a2d; intensity: 0.5"
          animation="property: position; to: 0 0.28 0; dir: alternate; dur: 4600; loop: true; easing: easeInOutSine;"
        ></a-gltf-model>

        <a-gltf-model
          src="#mito-model"
          position="1.6 0.5 -1.1"
          scale="0.6 0.6 0.6"
          rotation="-5 48 -8"
          gltf-emissive="color: #d44020; intensity: 0.45"
          animation="property: position; to: 1.6 0.78 -1.1; dir: alternate; dur: 5200; delay: 900; loop: true; easing: easeInOutSine;"
        ></a-gltf-model>

        <a-gltf-model
          src="#mito-model"
          position="-1.2 -0.3 0.9"
          scale="0.52 0.52 0.52"
          rotation="6 -28 5"
          gltf-emissive="color: #ec7063; intensity: 0.42"
          animation="property: position; to: -1.2 -0.02 0.9; dir: alternate; dur: 4100; delay: 1800; loop: true; easing: easeInOutSine;"
        ></a-gltf-model>

        <a-gltf-model
          src="#mito-model"
          position="0.6 -0.8 1.3"
          scale="0.58 0.58 0.58"
          rotation="12 62 -10"
          gltf-emissive="color: #c0392b; intensity: 0.48"
          animation="property: position; to: 0.6 -0.52 1.3; dir: alternate; dur: 4800; delay: 2700; loop: true; easing: easeInOutSine;"
        ></a-gltf-model>

        <a-light type="point" color="#ff5533" intensity="1.4" distance="9" decay="2" position="0.5 0 0"></a-light>
      </a-entity>

      <!-- ③ ENDOPLASMIC RETICULUM  ·  blue  ·  left side -->
      <a-entity
        id="er-group"
        position="-7 1.5 -1"
        organelle-info="
          title:    Endoplasmic Reticulum;
          body:     A network of folded membranes. Rough ER has ribosomes and makes proteins. Smooth ER synthesises lipids and detoxifies chemicals.;
          distance: 4.5;
          color:    #3498db;
          audio:    endoplasmic-reticulum.mp3;
        "
      >
        <a-entity er-stack="layers: 9; color: #3498db; spacing: 0.5"></a-entity>
        <a-light type="point" color="#2980b9" intensity="1.2" distance="8" decay="2"></a-light>
      </a-entity>

      <!-- ④ RIBOSOMES  ·  purple  ·  scattered + cluster label -->
      <a-entity
        id="ribosomes-cluster"
        position="3 3 3"
        organelle-info="
          title:    Ribosomes;
          body:     Tiny molecular machines made of RNA and protein. They translate genetic instructions from mRNA into polypeptide chains (proteins).;
          distance: 5;
          color:    #9b59b6;
          audio:    ribosomes.mp3;
        "
      >
        <a-sphere radius="0.14" position=" 0    0    0"    material="color: #9b59b6; opacity: 0.9; emissive: #6a1f96; emissiveIntensity: 0.5;"></a-sphere>
        <a-sphere radius="0.11" position=" 0.3  0.2  0.1" material="color: #8e44ad; opacity: 0.9; emissive: #5e1680; emissiveIntensity: 0.5;"></a-sphere>
        <a-sphere radius="0.10" position="-0.2  0.3 -0.2" material="color: #a569bd; opacity: 0.9; emissive: #6a1f96; emissiveIntensity: 0.45;"></a-sphere>
        <a-sphere radius="0.12" position=" 0.1 -0.2  0.3" material="color: #9b59b6; opacity: 0.9; emissive: #5e1680; emissiveIntensity: 0.5;"></a-sphere>
      </a-entity>

      <!-- Scattered ribosomes throughout the cytoplasm -->
      <a-entity ribosome-scatter="count: 70; radius: 13; color: #9b59b6"></a-entity>

      <!-- ⑤ GOLGI APPARATUS  ·  yellow  ·  front-right -->
      <a-entity
        id="golgi"
        position="5 1.5 5"
        organelle-info="
          title:    Golgi Apparatus;
          body:     The cell's postal system. Receives proteins from the ER, modifies and packages them into vesicles, then ships them to their final destinations.;
          distance: 4;
          color:    #f1c40f;
          audio:    golgi-apparatus.mp3;
        "
      >
        <a-entity golgi-apparatus="layers: 6; color: #f1c40f; spacing: 0.4"></a-entity>
        <a-light type="point" color="#f39c12" intensity="1.2" distance="7" decay="2"></a-light>
      </a-entity>

      <!-- ══════════════════════ LIGHTING ══════════════════════ -->
      <a-light type="ambient"     color="#2a6b40"  intensity="0.85"></a-light>
      <a-light type="hemisphere"  color="#3db882"  ground-color="#4d3a10" intensity="0.65"></a-light>
      <a-light type="directional" position="10 8 -10" color="#6ef5c0" intensity="0.5"></a-light>
      <!-- Rim light — lifts organelle silhouettes from behind -->
      <a-light type="directional" position="-8 12 8"  color="#88ddff" intensity="0.3"></a-light>

      <!-- ══════════════════════ SKY ══════════════════════ -->
      <a-sky color="#030a05"></a-sky>

      <!-- ══════════════════════ CAMERA RIG ══════════════════════ -->
      <a-entity
        id="rig"
        position="0 0 11"
        cell-locomotion="speed: 4.0; acceleration: 12; friction: 10; boundary: 18.5; playerHeight: 1.6"
      >

        <a-camera
          id="camera"
          look-controls="pointerLockEnabled: true; reverseMouseDrag: false"
          wasd-controls="enabled: false"
          camera="userHeight: 1.6"
          fov="80" near="0.05" far="100"
        >
          <a-cursor
            color="#52d4a4" opacity="0.7"
            raycaster="objects: .interactive; far: 25"
          ></a-cursor>

          <!-- Desktop movement hint -->
          <a-plane
            position="0 -0.38 -1" width="0.95" height="0.09"
            material="color: #000; opacity: 0.45; transparent: true"
            visible-in-vr-mode="false"
          >
            <a-text
              value="WASD / Arrows — move  |  Mouse — look  |  Walk near organelles to learn more"
              align="center" color="#52d4a4" width="2.1" position="0 0 0.001"
            ></a-text>
          </a-plane>
        </a-camera>

        <!-- Quest controllers -->
        <a-entity
          laser-controls="hand: left"
          raycaster="objects: .interactive; far: 25; showLine: true; lineColor: #52d4a4; lineOpacity: 0.6"
        ></a-entity>
        <a-entity
          laser-controls="hand: right"
          raycaster="objects: .interactive; far: 25; showLine: true; lineColor: #52d4a4; lineOpacity: 0.6"
        ></a-entity>
      </a-entity>

    </a-scene>
  </body>
</html>
